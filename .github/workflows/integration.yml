# Integration tests -- REQUIRES LIVE NEO4J AND POSTGRESQL INSTANCES.
#
# These 193 tests run real Cypher and real SQL against real databases. They are the
# only coverage of the query text itself, and they have already caught real bugs
# the unit suite could not (a transaction-boundary bug in Phase 1; a grounding scope
# bug, a substring-search bug, and a missing ORDER BY tiebreaker in Phase 2) -- but
# they cannot run on every push without databases to point at.
#
# This workflow is therefore OPT-IN and separate from CI:
#
#   * Trigger manually (Actions -> "Integration tests (requires Neo4j + PostgreSQL)"
#     -> Run) or on the weekly schedule below.
#   * It connects to managed Neo4j Aura and managed PostgreSQL using repository
#     secrets, which matches the production target and needs NO Docker on the
#     runner.
#   * With secrets absent it exits successfully with an explanatory notice, rather
#     than failing and training people to ignore red builds.
#   * Both services are checked independently: if only one is configured, the tests
#     for the other still skip cleanly rather than failing the whole run.
#
# Required repository secrets:
#   NEO4J_URI       neo4j+s://<id>.databases.neo4j.io
#   NEO4J_USERNAME
#   NEO4J_PASSWORD
#   DATABASE_URL    postgresql+asyncpg://user:pw@host/db
#
# Use DEDICATED test instances for both. Each test namespaces its data by a unique
# user_id and deletes it afterwards (both stores), but this suite does write and
# delete real data.
name: Integration tests (requires Neo4j + PostgreSQL)

on:
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC.
    - cron: "0 4 * * 1"

defaults:
  run:
    working-directory: backend

jobs:
  integration:
    name: Integration tests against Neo4j Aura + managed PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether credentials are configured
        id: check
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$NEO4J_URI" ] && [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Neither NEO4J_URI nor DATABASE_URL is set. Skipping integration tests."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            [ -z "$NEO4J_URI" ] && echo "::notice::NEO4J_URI not set -- Neo4j-backed tests will skip."
            [ -z "$DATABASE_URL" ] && echo "::notice::DATABASE_URL not set -- PostgreSQL-backed tests will skip."
          fi

      - name: Install uv
        if: steps.check.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: uv sync --extra dev

      - name: Apply graph schema
        if: steps.check.outputs.configured == 'true'
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          if [ -n "$NEO4J_URI" ]; then
            uv run python ../scripts/init_graph.py
          fi

      - name: Apply PostgreSQL migrations
        if: steps.check.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            uv run alembic upgrade head
          fi

      - name: Migration safety (single head, no autogenerate drift)
        # Phase 11 (M7): `alembic check` fails if the models and migrations
        # disagree -- including a proposal to drop the raw-SQL HNSW index,
        # which env.py's include_object now prevents.
        if: steps.check.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            test "$(uv run alembic heads | wc -l)" -eq 1
            uv run alembic check
          fi

      - name: Integration tests
        if: steps.check.outputs.configured == 'true'
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Phase 11: never an external LLM in this workflow.
          LLM_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
        run: uv run pytest -m "integration and not scratch_db" -v

      - name: Migration tests on throwaway databases (skip if the role cannot CREATE DATABASE)
        if: steps.check.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run pytest -m scratch_db -v -rs

      - name: Deterministic evaluations (no external LLM)
        # Phase 11 (M11): graph API conformance and the retrieval regression.
        # LLM_PROVIDER=fake is forced, and real-LLM sections are opt-in only
        # (eval/opt_in.py), so this step can never spend provider quota.
        if: steps.check.outputs.configured == 'true'
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
        run: |
          if [ -n "$NEO4J_URI" ] && [ -n "$DATABASE_URL" ]; then
            uv run python eval/graph_api_runner.py
            uv run python eval/retrieval_runner.py
            uv run python eval/document_runner.py
          fi

      - name: Fail if tests skipped despite both credentials configured
        # A silent skip here would mean neither store is actually covered while
        # the badge stays green. Only enforced when BOTH secrets are present --
        # a partial setup is expected to leave some tests skipped.
        if: steps.check.outputs.configured == 'true'
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
        run: |
          set -o pipefail
          uv run pytest -m "integration and not scratch_db" -q 2>&1 | tee out.txt
          if [ -n "$NEO4J_URI" ] && [ -n "$DATABASE_URL" ] && grep -q "skipped" out.txt; then
            echo "::error::Both credentials were configured but some integration tests skipped."
            exit 1
          fi
