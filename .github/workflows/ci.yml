# Default CI: lint, unit tests, and the Cypher/SQL isolation audits.
#
# This workflow deliberately requires NO database and NO Docker. The unit suite
# (484 tests) runs entirely against in-process test doubles -- FakeLLMClient and
# FakeEmbeddingClient -- so every push gets fast, free, deterministic feedback --
# no API key, no network, no cost. Integration tests need a real Neo4j and a real
# PostgreSQL and live in integration.yml, which is opt-in.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push to the same ref cancels the previous run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  secret-scan:
    name: Secret scan (offline)
    # Phase 11: scripts/secret_scan.py -- no dependencies, no network. Fails
    # on high-confidence credential shapes and on files that must never be
    # committed (.env, keys, database dumps, backup archives).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files
        run: python3 scripts/secret_scan.py

  dependency-audit:
    name: Dependency audit
    # Phase 11: known-vulnerability check of the locked RUNTIME dependencies.
    # Needs the vulnerability databases (network), so it is its own job: a
    # service outage fails this job only, never the deterministic ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Python (pip-audit over the uv lockfile, runtime deps only)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip --no-deps --timeout 60 -r /tmp/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Frontend (npm audit, production deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check app tests ../scripts

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in pyproject.toml; 3.14 is the development
        # version. Testing both catches accidental use of newer-only syntax.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Unit tests
        # No NEO4J_*/DATABASE_URL variables are set, so anything that needs a
        # database would fail rather than silently pass -- see the guard step
        # below. LLM_PROVIDER/EMBEDDING_PROVIDER are not set either; Fake clients
        # are the default, so no API key is needed or used.
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit -v

      - name: Cypher and SQL safety audits
        # Called out as their own step because they enforce multi-user isolation:
        # every Cypher statement filters on $user_id, and every SQL repository
        # goes through UserScopedRepository rather than a bare select/update/
        # delete. A failure here is a potential cross-user data leak, not a
        # style problem.
        run: |
          uv run --python ${{ matrix.python-version }} pytest \
            tests/unit/test_cypher_safety.py tests/unit/test_sql_safety.py -v

      - name: Verify integration tests skip without services
        # Guards the guard: if integration tests ever stopped skipping cleanly,
        # the default pipeline would start failing for the wrong reason, or worse,
        # would quietly stop covering the graph and the database at all.
        run: |
          set -o pipefail
          uv run --python ${{ matrix.python-version }} pytest -q 2>&1 | tee result.txt
          grep -q "skipped" result.txt || {
            echo "::error::Expected integration tests to be skipped without Neo4j/PostgreSQL."
            exit 1
          }

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    # Phase 10. Like the backend jobs: no database, no Docker, no backend
    # server. End-to-end tests need the real stack and run locally
    # (frontend/README.md "End-to-end tests").
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv (for the OpenAPI drift check)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: |
          npm ci
          (cd ../backend && uv sync --extra dev)

      - name: Generated API types match the backend
        # schema.d.ts is generated from the FastAPI app object (no server).
        # A diff means a backend API change was not propagated to the UI.
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes react/no-danger)
        run: npm run lint

      - name: No raw HTML rendering
        # Memory, document and conversation content is untrusted data.
        run: |
          if grep -rn "dangerouslySetInnerHTML\|\.innerHTML\s*=" app components lib; then
            echo "::error::Raw HTML rendering is not allowed (docs/adr/0029)."
            exit 1
          fi

      - name: Unit and component tests
        run: npm test

      - name: Production build
        env:
          BACKEND_ORIGIN: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
