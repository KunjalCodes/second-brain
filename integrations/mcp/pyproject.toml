[project]
name = "memory-engine-mcp"
version = "0.1.0"
description = "MCP adapter for the AI Second Brain project-memory API (provider-agnostic, no LLM)"
requires-python = ">=3.12"
dependencies = ["mcp>=2.2,<3", "httpx>=0.28,<1"]

[project.scripts]
memory-engine-mcp = "memory_engine_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_engine_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
