[project]
name = "ai-second-brain-backend"
version = "0.1.0"
description = "Persistent graph-based memory engine for AI agents (Phase 1: graph memory foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "neo4j>=5.26",
    # Phase 2: PostgreSQL holds application/conversation state (ADR 0006).
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Phase 2: Gemini is the initial development provider. Imported ONLY in
    # app/llm/providers/gemini.py -- the rest of the app depends on LLMClient.
    "google-genai>=1.0",
    # Phase 3: pgvector column type + SQLAlchemy integration (ADR 0009). A thin
    # client-side type, not a service -- the vector store is the same PostgreSQL
    # already in use.
    "pgvector>=0.3",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a reachable Neo4j and/or PostgreSQL (skipped when absent)",
    "llm: calls a real LLM provider -- requires an API key and COSTS MONEY (never in default CI)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
